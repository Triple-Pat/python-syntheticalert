name: Lint and Test
run-name: "Lint and Test: ${{ github.event.head_commit.message || github.event.pull_request.title }}"
on:
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: read
jobs:
  ci:
    name: Lint and Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked

      # --- Linting ---
      - name: YAML Lint
        run: uv run yamllint .
      - name: Ruff Lint
        run: uv run ruff check .
      - name: Ruff Format
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy

      # --- Tests ---
      - name: Pytest
        run: uv run pytest --cov-fail-under=100 --cov-report=xml
      # Feeds the README's Coveralls badge with measured coverage. Main only:
      # fork PRs get a read-only token and the upload would fail. One matrix
      # leg only, so Coveralls sees one report per commit.
      - name: Coveralls
        if: github.ref == 'refs/heads/main' && matrix.python-version == '3.14'
        uses: coverallsapp/github-action@v2
        with:
          file: coverage.xml
          format: cobertura
