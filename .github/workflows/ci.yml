name: Lint and Test
run-name: "Lint and Test: ${{ github.event.head_commit.message || github.event.pull_request.title }}"
on:
  push:
    branches:
      - main
  pull_request:
  # The release workflow runs this whole suite before it publishes.
  workflow_call:
permissions:
  contents: read
jobs:
  ci:
    name: Lint and Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Newest first: the one-leg steps below run on job-index 0, and they
        # should run the newest locked tools.
        python-version: ["3.15", "3.14", "3.13", "3.12", "3.11"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ matrix.python-version }}
          # No cache on release tags: the published files are built here,
          # and they must not restore anything an earlier run could have
          # written.
          enable-cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - run: uv sync --locked

      # --- Linting ---
      - name: YAML Lint
        run: uv run yamllint .
      - name: Ruff Lint
        run: uv run ruff check .
      - name: Ruff Format
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy
      # Python-independent, so one leg is enough.
      - name: GitHub Actions Security Lint
        if: strategy.job-index == 0
        run: uv run zizmor --format=github .
        env:
          GH_TOKEN: ${{ github.token }}

      # --- Tests ---
      - name: Pytest
        run: uv run pytest --cov-report=xml
      # Feeds the README's Coveralls badge with measured coverage, so it
      # runs before the coverage gate: the badge shows the real number even
      # when the gate fails. Main only: the badge tracks main, and pull
      # requests are held to the gate below rather than reported to
      # Coveralls. One matrix leg only (the first, so the condition survives
      # matrix edits), so Coveralls sees one report per commit. A Coveralls
      # outage must not redden a run whose lint and tests passed, hence
      # fail-on-error: false.
      - name: Coveralls
        if: github.ref == 'refs/heads/main' && strategy.job-index == 0
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          file: coverage.xml
          format: cobertura
          fail-on-error: false
      - name: Coverage gate
        run: uv run coverage report --fail-under=100

      # --- Packaging ---
      # Checks what a release would upload, on every commit, so the first
      # upload to PyPI is not the first time the package is built: the
      # metadata and README pass PyPI's checks, and the wheel installs and
      # works in a fresh environment with none of the dev dependencies.
      - name: Build
        run: uv build
      - name: Check the distribution metadata
        run: uv run twine check --strict dist/*
      - name: Install the wheel into a fresh environment
        run: >-
          uv run --isolated --no-project --with dist/*.whl
          python -c "import syntheticalert; print(syntheticalert.SyntheticAlert()())"
      # On a release tag, the release workflow publishes exactly these
      # files, the ones the checks above passed, so its job that holds
      # publishing rights never runs a build. The wheel is pure Python, so
      # any leg's build serves.
      - name: Keep the distribution for the release
        if: strategy.job-index == 0 && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
