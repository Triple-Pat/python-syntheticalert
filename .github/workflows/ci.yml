name: Lint and Test
run-name: "Lint and Test: ${{ github.event.head_commit.message || github.event.pull_request.title }}"
on:
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: read
jobs:
  ci:
    name: Lint and Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked

      # --- Linting ---
      - name: YAML Lint
        run: uv run yamllint .
      - name: Ruff Lint
        run: uv run ruff check .
      - name: Ruff Format
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy

      # --- Tests ---
      - name: Pytest
        run: uv run pytest --cov-report=xml
      # Feeds the README's Coveralls badge with measured coverage, so it
      # runs before the coverage gate: the badge shows the real number even
      # when the gate fails. Main only: the badge tracks main, and pull
      # requests are held to the gate below rather than reported to
      # Coveralls. One matrix leg only (the first, so the condition survives
      # matrix edits), so Coveralls sees one report per commit. A Coveralls
      # outage must not redden a run whose lint and tests passed, hence
      # fail-on-error: false.
      - name: Coveralls
        if: github.ref == 'refs/heads/main' && strategy.job-index == 0
        uses: coverallsapp/github-action@v2
        with:
          file: coverage.xml
          format: cobertura
          fail-on-error: false
      - name: Coverage gate
        run: uv run coverage report --fail-under=100
