[project]
name = "triplepat-syntheticalert"
version = "0.0.0"
description = "A synthetic alert measurement callback, so a Triple Pat check-in timer can verify your alerting pipeline end to end."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Triple Pat" }]
requires-python = ">=3.10"
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: System Administrators",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Monitoring",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://triplepat.com"
Source = "https://github.com/Triple-Pat/python-syntheticalert"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "syntheticalert"

[dependency-groups]
dev = [
  "mypy",
  "opentelemetry-api",
  "opentelemetry-sdk",
  "prometheus-client",
  "pytest",
  "pytest-cov",
  "pytest-rerunfailures",
  "ruff",
  "yamllint",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812", # trailing commas: handled by the formatter
  "CPY001", # no copyright headers; LICENSE covers the repo
  "D203",   # conflicts with D211
  "D107",   # __init__ args are documented in the class docstring (Google style)
  "D213",   # conflicts with D212
  "EM102",  # f-string messages in raise are idiomatic
  "S311",   # random is the right tool for statistical sampling, not crypto
  "TRY003", # the validation messages belong at the raise site
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
  "D",       # test docstrings are the test names
  "S101",    # assert is how pytest works
  "SLF001",  # tests inspect private state deliberately
  "PLR2004", # magic numbers are the point of the assertions
  "TC001",   # fixtures are runtime imports
  "TC002",   # pytest is a runtime import even when only annotations use it
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
# CI adds --cov-fail-under=100; keeping it out of addopts lets partial local runs pass.
addopts = "--cov=syntheticalert --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:"]
